<!doctype html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="utf-8">
  <title>Agent | Autonomous AI Software Engineer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Autonomous AI Software Engineer and Intelligent Coding Teammate.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { 
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background-color: #000000; 
      color: #ffffff; 
      -webkit-font-smoothing: antialiased; 
      -moz-osx-font-smoothing: grayscale;
      margin: 0; 
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .font-heading { font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif; }
    .font-sans { font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif; }
    .font-mono, pre, code { font-family: 'JetBrains Mono', monospace; }

    /* Custom high-contrast monochrome scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #000000; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }

    /* Resizer styling */
    .resizer-handle {
      width: 4px;
      cursor: col-resize;
      background: #18181b;
      transition: background 0.15s ease, box-shadow 0.15s ease;
      position: relative;
      z-index: 30;
      flex-shrink: 0;
    }
    .resizer-handle:hover, .resizer-handle.resizing {
      background: #8ab4f8;
      box-shadow: 0 0 8px rgba(138, 180, 248, 0.6);
    }
  </style>
</head>
<body class="bg-black text-white font-sans selection:bg-[#8ab4f8] selection:text-black">
  <app-root></app-root>
</body>
</html>
